# ═══════════════════════════════════════════════════════════════════
# RRI Backend — Docker Compose (production-grade local setup)
#
# Usage:
#   cp .env.example .env        # configure secrets
#   docker compose up --build   # first run (builds image + seeds DB)
#   docker compose up           # subsequent runs
#   docker compose down -v      # tear down (destroys DB volume)
#
# Access:
#   API:      http://localhost:8081/api/
#   Swagger:  http://localhost:8081/api/docs
#   Postgres: localhost:5432 (for psql / pgAdmin)
# ═══════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rri-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rriadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rridb}

    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"

    volumes:
      # Named volume — data persists across restarts.
      # Use `docker compose down -v` to wipe and start fresh.
      - ./pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rriadmin} -d ${POSTGRES_DB:-rridb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    # Tune for local dev — lower memory, faster checkpoints
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c log_statement=none
        -c log_min_duration_statement=500

    networks:
      - rri-network
  # -- Pgadmin ----------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rri-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_EXTERNAL_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rri-network

  # ── RRI Backend ────────────────────────────────────────────────
  api:
    image: rri-backend:latest
    container_name: rri-backend
    restart: unless-stopped

    # Wait for DB to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Database (Prisma connection string) ────────────────────
      # Uses the Docker internal hostname 'db', NOT localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rriadmin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rridb}?schema=public&connection_limit=5

      # ── App config ─────────────────────────────────────────────
      PORT: 8081
      ENV: ${ENV:-PROD}
      WEBSITE: ${WEBSITE:-http://localhost:3000}

      # ── Auth secrets ───────────────────────────────────────────
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET in .env}
      JWT_SALT: ${JWT_SALT:?Set JWT_SALT in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}

      # ── Google OAuth (optional — anonymous mode works without) ─
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      client_id: ${GOOGLE_CLIENT_ID:-}

      # ── DB init flag ───────────────────────────────────────────
      # Set to "true" on first run to apply migrations + seed questions.
      # Set to "false" or remove after initial setup.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DB: ${SEED_DB:-true}

    ports:
      - "${API_EXTERNAL_PORT:-8081}:8081"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Override the Dockerfile CMD with the entrypoint script
    # that handles migrations + seeding before starting the app.
    entrypoint: ["dumb-init", "--"]
    command: ["sh", "./docker-entrypoint.sh"]

    networks:
      - rri-network

volumes:
  pgdata:
    driver: local

networks:
  rri-network:
    driver: bridge
